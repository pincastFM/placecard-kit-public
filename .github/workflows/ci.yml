# The kit's checks on every push and pull request: Vue 3.3.4 (the oldest peer, NYID's) and the latest
# Vue, typecheck, every test, and the package as it would publish.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vue: ['3.3.4', 'latest']
    name: Vue ${{ matrix.vue }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: matrix.vue != '3.3.4'
        run: npm i --no-save vue@${{ matrix.vue }} @vue/compiler-sfc@${{ matrix.vue }}
      - run: node -p "'vue ' + require('vue/package.json').version"
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
